[project]
name = "moby-dick"
version = "0.1"
dependencies = [
    # crt: credentials from `aws login` sessions, read by s3fs
    "botocore[crt]",
    "cartopy >= 0.25.0",
    "cftime",
    "chex",
    "click",
    "dask",
    "dm-haiku",
    "dm-tree",
    "fsspec",
    # Should be kept in sync with version used in spack containerize
    "gdal-utils == 3.13.1 ; sys_platform == 'linux'",
    "gdal[numpy] == 3.13.1 ; sys_platform == 'linux'",
    # On macOS, gdal is installed via brew and should be updated to the latest version
    "gdal-utils == 3.13.1 ; sys_platform == 'darwin'",
    "gdal[numpy] == 3.13.1 ; sys_platform == 'darwin'",
    "gmsh",
    "grain >= 0.2.16",
    "graphviz >= 0.21",
    "humanize",
    "ipywidgets",
    # Should be kept it in sync with the version used in NVIDIA container
    "jax>=0.11",
    "jraph",
    "matplotlib",
    "networkx",
    "numcodecs",
    "numpy",
    "optax",
    "orbax-checkpoint >= 0.11.30",
    "pandas",
    "pydantic",
    "pydantic-settings >= 2.0",
    "pyproj",
    "rich",
    "rtree",
    # Without a lower bound, pip resolves botocore[crt] to a version aiobotocore rejects and falls back to s3fs 0.4
    "s3fs >= 2026.9.0",
    "scipy",
    "seamsh@git+https://github.com/stefanocampanella/seamsh.git@develop",
    "tensorboard",
    "tensorflow >= 2.21.0",
    "tqdm",
    "trimesh",
    "treescope",
    "xarray",
    "xarray-tensorstore",
    "xprof",
    "zarr",
]
requires-python = ">=3.12, <3.13"
authors = [{name = "Stefano Campanella", email = "scampanella@ogs.it"}]
description = "Moby-Dick: deep-learning global ocean circulation models (first: Leviathan, derived from GraphCast)."
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
keywords = ["Ocean", "Ocean circulation", "Graph neural networks", "Prediction"]
classifiers = ["Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Physics"]

[project.scripts]
moby-dick = "mobydick:cli"

[project.urls]
Homepage = "https://github.com/stefanocampanella/moby-dick"

[dependency-groups]
dev = [
    "coverage[toml] >= 7.17",
    "pre-commit >= 4.7",
    "pytest >= 9",
    "pytest-cov >= 7.1",
    # Pinned: the rules enabled by default and the formatter's output change between versions; keep in sync with
    # .pre-commit-config.yaml.
    "ruff == 0.17.3",
    "ty == 0.0.97",
    # Type stubs for ty. scipy-stubs and pandas-stubs track their library's version: keep them compatible with the
    # image's scipy (1.18.1) and pandas (3.0.5), and update them when the base image updates these.
    "botocore-stubs",
    "pandas-stubs ~= 3.0.5",
    "scipy-stubs ~= 1.18.1",
    "types-networkx",
    "types-tqdm",
]

[build-system]
requires = ["setuptools (>= 67.0)"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
# The banner of the command line (mobydick.banner).
mobydick = ["assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test the sources, not the copy of the package installed in the image.
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
filterwarnings = [
    # Stores of the downloader are written and read with consolidated metadata in Zarr v3 too.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification",
    # zarr-python reads and writes whole shards of colexicographic arrays (transpose codec before sharding).
    "ignore:Combining a `sharding_indexed` codec disables partial reads",
    # Deprecations raised in our own code fail the tests, so they are fixed before the libraries remove the APIs.
    "error::DeprecationWarning:mobydick",
    "error::FutureWarning:mobydick",
]

[tool.coverage.run]
source = ["src/mobydick"]
branch = true
# Also measure Python subprocesses (the end-to-end training test runs moby-dick train in one).
patch = ["subprocess"]
omit = ["src/mobydick/__main__.py", "src/mobydick/notebooks_utils.py"]

[tool.coverage.report]
show_missing = true
# pytest --cov fails below this total (CI); coverage was 93 % on 7 Nov 2026.
fail_under = 80

[tool.ruff]
indent-width = 2
line-length = 120
# The notebooks are not maintained with the code (some cells are not valid Python).
extend-exclude = ["notebooks"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src"]
