[project]
name = "graphcast"
version = "0.1"
dependencies = [
    "cartopy >= 0.25.0",
    "cftime",
    "chex",
    "click",
    "dask",
    "dm-haiku",
    "dm-tree",
    "flax",
    "gdal-utils == 3.13.1 ; sys_platform == 'linux'",
    "gdal[numpy] == 3.13.1 ; sys_platform == 'linux'",
    # On macOS, gdal is installed via brew and should be updated to the latest version
    "gdal-utils == 3.13.1 ; sys_platform == 'darwin'",
    "gdal[numpy] == 3.13.1 ; sys_platform == 'darwin'",
    "gmsh",
    "grain >= 0.2.16",
    "graphviz >= 0.21",
    "humanize",
    "ipywidgets",
    "jax",
    "jraph",
    "matplotlib",
    "mpi4py",
    "networkx",
    "numcodecs",
    "numpy",
    "optax",
    "orbax-checkpoint >= 0.11.30",
    "pandas",
    "pydantic",
    "pyproj",
    "rich",
    "rtree",
    "scipy",
    "seamsh@git+https://github.com/stefanocampanella/seamsh.git@graphcast",
    "tensorboard",
    "tensorflow >= 2.21.0",
    "tqdm",
    "trimesh",
    "treescope",
    "xarray",
    "xprof",
    "zarr",
]
requires-python = ">=3.12, <3.13"
authors = [{name = "Stefano Campanella", email = "scampanella@ogs.it"}]
description = "Data-driven global ocean circulation model based on Graphcast by Google DeepMind."
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
keywords = ["GraphCast", "Ocean", "Prediction"]
classifiers = ["Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Oceanography",
    "Topic :: Scientific/Engineering :: Physics"]

[project.scripts]
graphcast = "graphcast:cli"

[project.urls]
Homepage = "https://github.com/stefanocampanella/graphcast"

[build-system]
requires = ["setuptools (>= 67.0)"]
build-backend = "setuptools.build_meta"