description = """
  GraphCast model for the ocean at 0.25deg resolution, \
  50 depth levels and sea ice, forced by atmospheric variables and river discharge. \
  This model is trained on ARCO-OCEAN data from 01-01-1993 to 30-06-2019, \
  and can be causally evaluated on later years. \
  It uses a global ocean mesh with uniform target mesh size of 50 km and 16 message passing steps. \
  GraphCast is described in the paper \
  `GraphCast: Learning skillful medium-range global weather forecasting`(https://arxiv.org/abs/2212.12794). \
  For a description of the ocean model, see README at \
  https://github.com/stefanocampanella/graphcast.
  """
license = """
  The model weights are licensed under the Creative Commons \
  Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0). You \
  may obtain a copy of the License at: \
  https://creativecommons.org/licenses/by-nc-sa/4.0/. \
  The weights were trained on ARCO-OCEAN data, see README at \
  https://github.com/inogs/arco-ocean \
  for attribution statement. \
  """
training_steps = 40_000
seed = 42

[task]
# State at the input time; static fields are inputs too (as in GraphCast).
input_variables = [
    "zos",
    "thetao",
    "so",
    "uo",
    "vo",
    "siconc",
    "sithick",
    "usi",
    "vsi",
    "glorys_deptho",
    "glorys_mask",
    "glofas_mask",
    "uparea",
    "z",
    "lsm",
    "year_progress_sin",
    "year_progress_cos",
]
target_variables = [
    "zos",
    "thetao",
    "so",
    "uo",
    "vo",
    "siconc",
    "sithick",
    "usi",
    "vsi",
]
# Given at the target time: atmosphere and river discharge (waves are not used yet).
forcing_variables = [
    "10u",
    "10v",
    "2d",
    "2t",
    "msl",
    "ssrd",
    "strd",
    "tp",
    "dis24",
    "year_progress_sin",
    "year_progress_cos",
]
levels = "all"
# Alternatives use original zero-based depth positions, independently per source:
# levels = [0, 4, 8, 12, 16, 20, 24, 28, 32, 34]
# levels = { start = 0, stop = 8, step = 2 }  # Inclusive stop: 0, 2, 4, 6, 8.
# Bounds may be omitted; step defaults to 1. Negative/reverse slices are unsupported.
input_duration = "1d"

[model]
latent_size = 512
# Mesh x message passing study (docs/jupiter-hackathon/results/mesh_msg-2026-10-29): 50 km x 16 steps has the lowest
# validation loss for its cost; 40 km x 16 is 1.4 % lower at 2.2x the step time and needs edge_chunk_size = 262144.
gnn_msg_steps = 16
hidden_layers = 1
radius_query_fraction_edge_length = 0.6
# Grid nodes only for grid points connected by an edge (encoder senders, decoder receivers): the others only cost memory.
connected_grid_nodes = true

# Level weights sum to 1, so a volume variable's loss is about 1/50 of a surface variable's at 50 levels: weights of
# 1/50 = 0.02 make each surface variable count as one volume variable. Change them with the number of levels.
[model.per_variable_weights]
zos = 0.02
siconc = 0.02
sithick = 0.02
usi = 0.02
vsi = 0.02
thetao = 1.0
so = 1.0
uo = 1.0
vo = 1.0

[mesh]
path = "/data/geometry/uniform_50km.msh"
mesh_size_tag_name = "MeshSize"
step = 0

# Boolean (lat, lon) mask written by graphcast download-mask (configs/download/mask.toml selects variable and level).
[mask]
path = "/data/mask"
fill_value = 0.0

# Standardized anomaly store written by graphcast download, read with TensorStore; task.levels are selected here and
# in tendency_std.
[dataset]
path = "/data/dataset"
# TensorStore concurrency of file I/O and decoding, per process (each Grain worker has its own).
io_threads = 16

[grain_dataset]
target_lead_times = "1d"
split_date = "2019-06-30T00:00:00"
local_batch_size = 1

# Grain reader and multiprocessing options are read from GRAPHCAST_GRAIN_* environment variables, see
# graphcast.grain_utils.GrainRuntimeConfig and clusters/jupiter/.env.

[normalization]
skip_names = ["year_progress_cos", "year_progress_sin"]

[policy]
names_which_can_be_saved = []
names_which_can_be_offloaded = ["embedder", "graph_embedder", "message_passing", "graph_output"]
offload_src = "device"
offload_dst = "pinned_host"
# Apply the policy to the whole loss too: the names mark block outputs, which only it can offload.
remat_loss = false
# Remat options of the blocks: prevent_cse (recommended by JAX outside of scan) and scan over message passing.
prevent_cse = false
scan = true
# Update edge sets with more edges in chunks of this many edges (0: off).
edge_chunk_size = 0

# Standard deviation of the one-step tendencies (residual normalization), read with xarray.open_dataset (read table:
# its options; training requires chunks=None, the default when chunks is omitted).
[tendency_std]
path = '/data/tendency_std'

[tendency_std.read]
engine = "zarr"

[optimizer.schedule]
name = 'warmup_cosine_decay_schedule'
init_value = 0.0
peak_value = 1.0e-3
warmup_steps = 1000
decay_steps = 39_000
end_value = 3.0e-7

[[optimizer.gradient_transformation]]
name = 'clip_by_global_norm'
max_norm = 32.0

[[optimizer.gradient_transformation]]
name = 'adamw'
b1 = 0.9
b2 = 0.95
weight_decay = 0.1

[checkpoints]
max_to_keep=3
# Saving every step (the default) costs time; save every 500 steps.
save_interval_steps = 500

# Validation loss on held-out windows after grain_dataset.split_date, the same windows in every run.
[validation]
interval_steps = 250
num_samples = 128
