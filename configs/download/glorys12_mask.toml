[[datasets]]
dataset_id = 'cmems_mod_glo_phy_my_0.083deg_static'
dataset_version = '202311'
variables = ['mask']
dataset_part = 'bathy'
service = 'static-arco'

[postprocess.regrid]
method = 'conservative'
kwargs = {skipna = true, latitude_coord='latitude'}

[postprocess.regrid.grid]
south = -90.0
north = 90.0
west = -180.0
east = 179.0
resolution_lat = 1.0
resolution_lon = 1.0

[postprocess.ceil]

[postprocess.astype]
dtype = 'int32'
