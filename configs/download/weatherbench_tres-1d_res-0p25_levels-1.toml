# TODO: choose a good input chunk size for performance.
provider = 'gcs'
type = 'timeseries'
start = 1992-12-31T00:00:00
end = 2021-07-01T00:00:00

[temporary]
step = '13 W'

[slurm_array]
step = '364 W'

[[datasets]]
url = 'gs://weatherbench2/datasets/era5/1959-2023_01_10-wb13-6h-1440x721_with_derived_variables.zarr'
variables = ['10m_u_component_of_wind',
             '10m_v_component_of_wind',
             '2m_temperature',
             'mean_sea_level_pressure',
             'specific_humidity',
             'mean_surface_net_short_wave_radiation_flux',
             'mean_surface_net_long_wave_radiation_flux',
             'total_precipitation_6hr']

[[postprocess]]
name = 'isel'
level = 0
drop = true

[[postprocess]]
name = 'resample'
time = '1 D'
reduce = 'mean'

[[postprocess]]
name = 'chunk'
time = 'auto'
latitude = -1
longitude = -1

# TODO: choose a good output chunk size.
[save]
consolidated = true
chunk = {time = 1, latitude = -1, longitude = -1}
compressor = {cname = 'lz4', clevel = 1}
