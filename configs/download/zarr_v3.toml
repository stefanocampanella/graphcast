# Standardized anomalies in Zarr v3: shards of 8 (with depth) or 256 timesteps (as zarr_v3 in JUBE).
zarr_format = 3
time_shard = 256
depth_time_shard = 8
subchunk_write_order = "morton"
# Threads tuned for a booster node (288 cores, benchmark on 64 days); on login nodes (20-core quota)
# use num_workers = 8 and io_threads = 16. Dask threads hold about 8 GB of memory each.
num_workers = 32
io_threads = 64

# fsspec options of the inputs: an AWS profile, or anonymous S3 access.
[storage_options]
#profile = "xarray-s3-writer"
#anon = true
