# Standardized anomalies in Zarr v3: shards of 8 (with depth) or 256 timesteps with the chunks of each shard in lexicographic order (as zarr_v3_lexi in JUBE).
zarr_format = 3
time_shard = 256
depth_time_shard = 8
subchunk_write_order = "lexicographic"
# Dask threads: about 8 GB of memory each.
num_workers = 8

# fsspec options of the inputs; uncomment for anonymous S3 access.
[storage_options]
#anon = true
