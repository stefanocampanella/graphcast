# Standardized anomalies in Zarr v3: one chunk per timestep and depth level, in shards of 8 (with depth) or 256
# timesteps; the chunks of each shard are ordered by time, then depth.
zarr_format = 3
time_shard = 256
depth_time_shard = 8
subchunk_order = "lexicographic"
# Dask threads hold about 8 GB of memory each; on a node with few cores use num_workers = 8 and io_threads = 16.
num_workers = 16
io_threads = 64
