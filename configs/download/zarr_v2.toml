# Standardized anomalies in Zarr v2: one chunk per timestep and depth level.
zarr_format = 2
# Dask threads hold about 8 GB of memory each; on a node with few cores use num_workers = 8 and io_threads = 16.
num_workers = 32
io_threads = 256

# Time-dependent in the dataset but constant in fact: their first timestep is min-max normalized.
static_variables = ["z", "lsm"]

# Values outside the static mask of their source are 0 (a mask with depth masks variables without depth by its first
# level); variables without a mask must be finite everywhere.
[masks]
glorys_mask = [
    "thetao", "so", "uo", "vo", "zos", "siconc", "sithick", "usi", "vsi", "thetao_bottom", "so_bottom", "glorys_deptho",
]
waverys_mask = ["swh", "mwp", "mwd", "usd", "vsd", "waverys_deptho"]
glofas_mask = ["dis24", "uparea"]
