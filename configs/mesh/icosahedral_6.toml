description = """
  Global icosahedral multi-mesh (experimental), as in GraphCast: a regular icosahedron \
  refined 6 times (40,962 vertices), with the edges of all 7 levels, projected onto the \
  WGS84 ellipsoid (each vertex keeps its latitude and longitude). \
  Edges of the finest level are 110 to 132 km long. All units are meters. \
  The mesh covers land and sea and has no boundary.
