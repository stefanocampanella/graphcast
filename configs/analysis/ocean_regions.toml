# Ocean regions for the basin connectivity of moby-dick graph-statistics (mobydick.graph_statistics.RegionsConfig),
# passed to the command next to its settings (configs/analysis/graph_statistics.toml names the pairs it measures).
#
# Each [[regions]] table is the set of grid nodes inside any of its polygons of (longitude, latitude) vertices in
# degrees (longitudes in [-180, 360], beyond 180 across the antimeridian; straight edges on a longitude-latitude
# map). The
# polygons follow the coasts loosely, over land where possible: land has no grid nodes. Regions may overlap (the Aegean
# is part of the Mediterranean). The comment above each region says where it comes from.
#
# This file is partly based on the IHO Sea Areas:
#   Flanders Marine Institute (2018). IHO Sea Areas, version 3. Available online at https://www.marineregions.org/,
#   https://doi.org/10.14284/323. Licensed under CC BY-NC-SA 4.0 (https://creativecommons.org/licenses/by-nc-sa/4.0/).
# The regions marked "IHO area" are adapted from it (13 Nov 2026): each area grown by 0.3° to take in the coastal grid
# points of the 0.25° training mask outside its detailed coastline, the other IHO areas (the seas across the straits)
# removed, simplified to 2 % of the square root of its area (at least 0.12°), vertices rounded to 0.01°; ocean regions
# near a strait are an IHO area within a box; the Gulf of Boothia is clipped as described there, and the Bohol Sea is
# removed from the Sulu Sea. The other regions are drawn after the documented position of straits and coasts. The file
# as a whole is licensed under CC BY-NC-SA 4.0 (non-commercial, share-alike), the license of its IHO-based part.

