# Settings of moby-dick graph-statistics (mobydick.graph_statistics.GraphStatisticsConfig): the graphs of the model of
# configs/training/production_run.toml (50 km mesh, 16 message passing steps). Paths are container paths, as in the
# training configs.
mask = "/data/mask"
# Encoder radius as a fraction of the longest triangle edge at each mesh vertex: keep equal to the training config's
# model.radius_query_fraction_edge_length.
radius_query_fraction_edge_length = 0.6
# Shortest paths of the processors from this many sampled nodes per connected component (0: all nodes, exact but only
# feasible for small graphs: one breadth-first search per node).
num_sources = 32
seed = 0
length_bin_width_km = 5.0
quality_bins = 20

# The model's meshes, finest first: one, or a hierarchy (a V-cycle with message_passing_steps on each mesh on the way
# down; each decoder adds the coarser mesh's result to the finer mesh's state on the way up). Repeat the table for
# each mesh.
[[meshes]]
path = "/data/geometry/uniform_50km.msh"
message_passing_steps = 16

# Squashed grid-to-grid graph (mobydick.graph_statistics.squashed): grid node i -> j when the input at i reaches the
# output at j through the encoders, the message passing steps and the decoders. Grid nodes sampled as senders and
# receivers; geodesic lengths of at most max_targets edges per sampled node; nodes propagated together (dense boolean
# blocks of batch_size × grid nodes).
[squashed]
num_sources = 1024
max_targets = 4096
batch_size = 64
# Largest number of message passing steps (on every mesh) tried for the fewest steps connecting a basin and its ocean.
max_steps_to_connect = 128

# Basin connectivity in the squashed graph: each [[basin_connections]] pairs a semi-enclosed basin or inner sea with the
# nearby ocean it opens to, both [[regions]]: the grid nodes inside a polygon of (longitude, latitude) vertices in
# degrees (longitudes in [-180, 180], not crossing the antimeridian; straight edges on a longitude-latitude map). The
# polygons follow the coasts loosely, over land where possible: land has no grid nodes. Regions may overlap (the Aegean
# is part of the Mediterranean).
[[basin_connections]]
basin = "Mediterranean Sea"
ocean = "Gulf of Cadiz and off Portugal"

[[basin_connections]]
basin = "Black Sea"
ocean = "Aegean Sea"

[[basin_connections]]
basin = "Sea of Azov"
ocean = "Black Sea"

[[basin_connections]]
basin = "Red Sea"
ocean = "Gulf of Aden"

[[basin_connections]]
basin = "Persian Gulf"
ocean = "Gulf of Oman"

[[basin_connections]]
basin = "Baltic Sea"
ocean = "North Sea"

[[basin_connections]]
basin = "Gulf of California"
ocean = "Eastern tropical Pacific off the Gulf of California"

[[basin_connections]]
basin = "Hudson Bay"
ocean = "Labrador Sea"

# The Mediterranean without the Sea of Marmara and the Black Sea (east boundary through the Gallipoli peninsula and
# Anatolia), west of the Strait of Gibraltar (5.5° W) and without the Bay of Biscay.
[[regions]]
name = "Mediterranean Sea"
polygon = [
  [-5.5, 30.0], [36.8, 30.0], [36.8, 37.2], [27.0, 39.6], [26.3, 40.25], [25.9, 41.4], [14.0, 47.0], [3.0, 44.0],
  [-1.0, 42.0], [-5.5, 37.5],
]

[[regions]]
name = "Gulf of Cadiz and off Portugal"
polygon = [[-15.0, 33.0], [-6.2, 33.0], [-6.2, 39.5], [-15.0, 39.5]]

# The Black Sea north of the Bosporus, without the Sea of Azov (north of the Kerch Strait, 45.3° N east of 34.7° E).
[[regions]]
name = "Black Sea"
polygon = [
  [27.3, 42.6], [28.0, 41.3], [29.15, 41.25], [29.3, 41.05], [33.0, 40.9], [42.0, 40.7], [42.0, 45.3], [34.7, 45.3],
  [34.7, 46.9], [27.3, 46.9],
]

[[regions]]
name = "Sea of Azov"
polygon = [[34.7, 45.4], [39.6, 45.4], [39.6, 47.5], [34.7, 47.5]]

[[regions]]
name = "Aegean Sea"
polygon = [[22.5, 36.3], [26.0, 36.3], [26.0, 40.0], [24.0, 41.0], [22.5, 41.0]]

# North of the Bab-el-Mandeb (12.6° N), with the Gulfs of Suez and Aqaba.
[[regions]]
name = "Red Sea"
polygon = [[32.0, 12.6], [43.45, 12.6], [43.45, 30.5], [32.0, 30.5]]

[[regions]]
name = "Gulf of Aden"
polygon = [[44.5, 10.5], [51.0, 10.5], [51.0, 14.5], [44.5, 14.5]]

# West of the Strait of Hormuz (56.2° E).
[[regions]]
name = "Persian Gulf"
polygon = [[47.5, 23.0], [56.2, 23.0], [56.2, 30.5], [47.5, 30.5]]

[[regions]]
name = "Gulf of Oman"
polygon = [[57.0, 22.0], [61.5, 22.0], [61.5, 25.5], [57.0, 25.5]]

# East of the Danish straits (12.9° E), with the Gulfs of Bothnia, Finland and Riga; the north-west boundary runs over
# Sweden.
[[regions]]
name = "Baltic Sea"
polygon = [[12.9, 53.5], [30.5, 53.5], [30.5, 66.0], [20.5, 66.0], [16.5, 60.5], [12.9, 57.5]]

[[regions]]
name = "North Sea"
polygon = [[-1.0, 53.0], [7.0, 53.0], [7.0, 58.0], [-1.0, 58.0]]

# North of the line from Cabo San Lucas to Mazatlán (23.05° N); the west boundary runs along the spine of Baja
# California, so the Pacific coast of the peninsula is outside.
[[regions]]
name = "Gulf of California"
polygon = [
  [-109.6, 23.05], [-104.5, 23.05], [-104.5, 25.0], [-110.0, 32.5], [-115.2, 32.5], [-115.3, 30.0], [-113.6, 28.0],
  [-111.8, 25.8], [-110.2, 23.9],
]

[[regions]]
name = "Eastern tropical Pacific off the Gulf of California"
polygon = [[-112.0, 17.0], [-106.0, 17.0], [-106.0, 22.0], [-112.0, 22.0]]

# With James Bay, without Foxe Basin and Hudson Strait.
[[regions]]
name = "Hudson Bay"
polygon = [[-95.5, 51.0], [-76.5, 51.0], [-76.5, 62.3], [-80.0, 63.6], [-95.5, 64.0]]

[[regions]]
name = "Labrador Sea"
polygon = [[-60.0, 54.0], [-52.0, 54.0], [-52.0, 61.0], [-60.0, 61.0]]
