# Settings of moby-dick graph-statistics (mobydick.graph_statistics.GraphStatisticsConfig).
# Encoder radius as a fraction of the longest triangle edge at each mesh vertex: keep equal to the training config's
# model.radius_query_fraction_edge_length.
radius_query_fraction_edge_length = 0.6
# Shortest paths of the processors from this many sampled nodes per connected component (0: all nodes, exact but only
# feasible for small graphs: one breadth-first search per node).
num_sources = 32
seed = 0
length_bin_width_km = 5.0
quality_bins = 20

# Squashed grid-to-grid graphs (mobydick.graph_statistics.squashed): grid node i -> j when the input at i reaches the
# output at j through the encoders, message_passing_steps steps on every mesh and the decoders. One graph per entry.
[squashed]
message_passing_steps = [8, 16]
# Grid nodes sampled as senders and receivers; geodesic lengths of at most max_targets edges per sender; sources
# propagated together (dense blocks of batch_size × grid nodes).
num_sources = 1024
max_targets = 4096
batch_size = 64
